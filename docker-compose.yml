services:
  iot-webserver:
    build:
      context: .
    container_name: mhm-iot-webserver
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: ${APP_PORT:-8000}
      APP_TITLE: ${APP_TITLE:-MHM IoT Firmware Catalog}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-change-me}
      APP_PROTECTED_USERNAME: ${APP_PROTECTED_USERNAME:-admin}
      APP_PROTECTED_PASSWORD: ${APP_PROTECTED_PASSWORD:-change-me}
      APP_PROTECTED_PASSWORD_HASH: ${APP_PROTECTED_PASSWORD_HASH:-}
      APP_PASSWORD_SALT: ${APP_PASSWORD_SALT:-mhm-iot-webserver}
      APP_CONFIG_PATH: ${APP_CONFIG_PATH:-/app/config/firmware.jsonl}
      APP_FIRMWARE_ROOT: ${APP_FIRMWARE_ROOT:-/app/firmware}
    volumes:
      - ./config:/app/config:ro
      - ./firmware:/app/firmware:ro
    restart: unless-stopped
