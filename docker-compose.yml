services:
  iot-webserver:
    build:
      context: .
    container_name: mhm-iot-webserver
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_TITLE: MHM IoT Firmware Catalog
      APP_SECRET_KEY: ${APP_SECRET_KEY:-change-me}
      APP_PROTECTED_USERNAME: ${APP_PROTECTED_USERNAME:-admin}
      APP_PROTECTED_PASSWORD: ${APP_PROTECTED_PASSWORD:-change-me}
      APP_CONFIG_PATH: /app/config/firmware.jsonl
      APP_FIRMWARE_ROOT: /app/firmware
    volumes:
      - ./config:/app/config:ro
      - ./firmware:/app/firmware:ro
    restart: unless-stopped
